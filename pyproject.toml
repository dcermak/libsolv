[build-system]
requires = [
    "scikit-build>=0.11.0",
    "cmake>=3.5",
    "setuptools>=42",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp36-* cp37-* cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-win_amd64 *-macosx_* *-musllinux_*"

# smoke test
test-command = "python -c 'import solv; print(solv)'"

[tool.cibuildwheel.linux]
# Use manylinux images for broader compatibility
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
